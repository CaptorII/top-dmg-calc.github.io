<!doctype html>
<html class="no-js" lang="">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Damage Calculator</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <h1>Damage Calculator</h1>
  <img src="img/logo.png" alt="Logo" id="logo" />

  <div class="hpDiv">
  <p>
    <label for="hp" id="hpLabel" class="hpInfo">HP: </label>
    <input type="number" id="hp" min="0" max="1000" value="10" class="hpInfo" onchange="updateMax()" />
    <label for="maxHp" id="maxHpLabel" class="hpInfo"> / </label>
    <input type="number" id="maxHp" min="0" max="1000" value="10" class="hpInfo" />
    <label for="tempHp" id="tempHpLabel" class="hpInfo">Temp: </label>
    <input type="number" id="tempHp" min="0" max="1000" value="0" class="hpInfo" />
  </p>
  </div>
  <p>
  <div class="hpDiv">
    <label for="ep" id="epLabel" class="hpInfo">EP: </label>
    <input type="number" id="ep" min="0" max="1000" value="10" class="hpInfo" onchange="updateMax()" />
    <label for="maxEp" id="maxEpLabel" class="hpInfo"> / </label>
    <input type="number" id="maxEp" min="0" max="1000" value="10" class="hpInfo" />
    <label for="tempEp" id="tempEpLabel" class="hpInfo">Temp: </label>
    <input type="number" id="tempEp" min="0" max="1000" value="0" class="hpInfo" />
  </div>
  </p>
  <div class="hpDiv">
    <p>
      <label for="stamina" id="staminaLabel" class="hpInfo">Stamina: </label>
      <input type="number" id="stamina" min="0" max="1000" value="0" class="hpInfo" onchange="updateMax()" />
      <label for="maxStamina" id="maxStaminaLabel" class="hpInfo"> / </label>
      <input type="number" id="maxStamina" min="0" max="1000" value="0" class="hpInfo" />
      <label for="tempStamina" id="tempStaminaLabel" class="hpInfo">Temp: </label>
      <input type="number" id="tempStamina" min="0" max="1000" value="0" class="hpInfo" />
    </p>
    <p>
      <label for="mana" id="manaLabel" class="hpInfo">Mana: </label>
      <input type="number" id="mana" min="0" max="1000" value="0" class="hpInfo" onchange="updateMax()" />
      <label for="maxMana" id="maxManaLabel" class="hpInfo"> / </label>
      <input type="number" id="maxMana" min="0" max="1000" value="0" class="hpInfo" />
      <label for="tempMana" id="tempManaLabel" class="hpInfo">Temp: </label>
      <input type="number" id="tempMana" min="0" max="1000" value="0" class="hpInfo" />
    </p>
  </div>
  <table id="hpTable">
    <tr>
      <td><label for="blockRange">Block:</label></td>
      <td><input type="number" id="blockRange" min="0" max="100" value="0" /></td>
      <td><label for="wardRange">Ward:</label></td>
      <td><input type="number" id="wardRange" min="0" max="100" value="0" /></td>
    </tr>
    <tr>
      <td><label for="resImpact">Impact Resistance:</label></td>
      <td><input type="number" id="resImpact" min="-100" max="100" value="0" /></td>
      <td><label for="resFlux">Flux Resistance:</label></td>
      <td><input type="number" id="resFlux" min="-100" max="100" value="0" /></td>
    </tr>
    <tr>
      <td><label for="resFire">Fire Resistance:</label></td>
      <td><input type="number" id="resFire" min="-100" max="100" value="0" /></td>
      <td><label for="resChaos">Chaos Resistance:</label></td>
      <td><input type="number" id="resChaos" min="-100" max="100" value="0" /></td>
    </tr>
    <tr>
      <td><label for="resFrost">Frost Resistance:</label></td>
      <td><input type="number" id="resFrost" min="-100" max="100" value="0" /></td>
      <td><label for="resHoly">Holy Resistance:</label></td>
      <td><input type="number" id="resHoly" min="-100" max="100" value="0" /></td>
    </tr>
    <tr>
      <td><label for="resStorm">Storm Resistance:</label></td>
      <td><input type="number" id="resStorm" min="-100" max="100" value="0" /></td>
      <td><label for="resUnholy">Unholy Resistance:</label></td>
      <td><input type="number" id="resUnholy" min="-100" max="100" value="0" /></td>
    </tr>
    <tr>
      <td><label for="resAcid">Acid Resistance:</label></td>
      <td><input type="number" id="resAcid" min="-100" max="100" value="0" /></td>
    </tr>
    <tr>
      <td><label for="resPoison">Poison Resistance:</label></td>
      <td><input type="number" id="resPoison" min="-100" max="100" value="0" /></td>
    </tr>
  </table>
  <p><button type="submit" onclick="submitStats()">Save</button></p>

  <script src="js/setStats.js"></script>

</body>

</html>
