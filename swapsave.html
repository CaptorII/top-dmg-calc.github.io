<!doctype html>
<html class="no-js" lang="">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Damage Calculator</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<p id="navigation">
    <button id="setup">Setup</button>
    <button id="calculator">Calculator</button>
    <button id="swap">Swap Save</button>
</p>

<h1>Damage Calculator</h1>
<img src="img/logo.png" alt="Logo" id="logo" />

<table>
    <tr>
        <td><button id="fileASave">Save</button></td>
        <td><button id="fileBSave">Save</button></td>
        <td><button id="fileCSave">Save</button></td>
        <td><button id="fileDSave">Save</button></td>
        <td><button id="fileESave">Save</button></td>
    </tr>
    <tr>
        <td><input type="text" id="fileAName" class="saveName" maxlength="32" placeholder="Save name" /></td>
        <td><input type="text" id="fileBName" class="saveName" maxlength="32" placeholder="Save name" /></td>
        <td><input type="text" id="fileCName" class="saveName" maxlength="32" placeholder="Save name" /></td>
        <td><input type="text" id="fileDName" class="saveName" maxlength="32" placeholder="Save name" /></td>
        <td><input type="text" id="fileEName" class="saveName" maxlength="32" placeholder="Save name" /></td>
    </tr>
    <tr>
        <td><button id="fileALoad">Load</button></td>
        <td><button id="fileBLoad">Load</button></td>
        <td><button id="fileCLoad">Load</button></td>
        <td><button id="fileDLoad">Load</button></td>
        <td><button id="fileELoad">Load</button></td>
    </tr>
</table>

<div class="hpDiv">
    <p>
        <label for="hp" id="hpLabel" class="hpInfo">HP: </label>
        <input type="number" id="hp" min="0" max="1000" value="10" class="hpInfo" />
        <label for="maxHp" id="maxHpLabel" class="hpInfo"> / </label>
        <input type="number" id="maxHp" min="0" max="1000" value="10" class="hpInfo" />
        <label for="tempHp" id="tempHpLabel" class="hpInfo">Temp: </label>
        <input type="number" id="tempHp" min="0" max="1000" value="0" class="hpInfo" />
    </p>
</div>
<div class="hpDiv">
    <p>
        <label for="ep" id="epLabel" class="hpInfo">EP: </label>
        <input type="number" id="ep" min="0" max="1000" value="10" class="hpInfo" />
        <label for="maxEp" id="maxEpLabel" class="hpInfo"> / </label>
        <input type="number" id="maxEp" min="0" max="1000" value="10" class="hpInfo" />
        <label for="tempEp" id="tempEpLabel" class="hpInfo">Temp: </label>
        <input type="number" id="tempEp" min="0" max="1000" value="0" class="hpInfo" />
    </p>
</div>
<div class="hpDiv">
    <p>
        <label for="stamina" id="staminaLabel" class="hpInfo">Stamina: </label>
        <input type="number" id="stamina" min="0" max="1000" value="0" class="hpInfo" />
        <label for="maxStamina" id="maxStaminaLabel" class="hpInfo"> / </label>
        <input type="number" id="maxStamina" min="0" max="1000" value="0" class="hpInfo" />
        <label for="tempStamina" id="tempStaminaLabel" class="hpInfo">Temp: </label>
        <input type="number" id="tempStamina" min="0" max="1000" value="0" class="hpInfo" />
    </p>
    <p>
        <label for="mana" id="manaLabel" class="hpInfo">Mana: </label>
        <input type="number" id="mana" min="0" max="1000" value="0" class="hpInfo" />
        <label for="maxMana" id="maxManaLabel" class="hpInfo"> / </label>
        <input type="number" id="maxMana" min="0" max="1000" value="0" class="hpInfo" />
        <label for="tempMana" id="tempManaLabel" class="hpInfo">Temp: </label>
        <input type="number" id="tempMana" min="0" max="1000" value="0" class="hpInfo" />
    </p>
</div>

<script src="js/swapSave.js" type="module"></script>

</body>
</html>
